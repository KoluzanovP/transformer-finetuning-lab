# Деплой всего сервиса (Timeweb App Platform → тип «Docker Compose», либо
# `docker compose up -d --build` на своём сервере).
#
# ОДИН публичный сервис — web (Next.js, :8080). Он сам проксирует /api и /uploads
# во внутренний сервис api (см. apps/web/next.config.mjs → rewrites). Фронт и API
# на одном домене → CORS не нужен, отдельный nginx не нужен.
#
# База данных — УПРАВЛЯЕМАЯ (Timeweb Databases): укажите DATABASE_URL (публичный хост).
# Медиа — S3 (Timeweb S3): STORAGE_DRIVER=S3 + S3_*.
# Переменные задаются в панели App Platform (или в .env рядом на сервере).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-Админ}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Платформы}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-S3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Пусто = браузер обращается к тому же домену (/api), запросы проксирует Next.
        NEXT_PUBLIC_API_URL: ""
    restart: always
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "8080:8080"
    depends_on:
      - api
