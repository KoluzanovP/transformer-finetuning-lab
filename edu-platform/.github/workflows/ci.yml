# CI для EduPlatform.
# Примечание: GitHub Actions читает workflow из .github/ в КОРНЕ репозитория.
# Когда платформа вынесена в отдельный репозиторий edu-platform, этот файл
# оказывается в корне и работает как есть. Пути рассчитаны на корень репозитория.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edu
          POSTGRES_PASSWORD: edu
          POSTGRES_DB: edu_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://edu:edu@localhost:5432/edu_platform_test?schema=public
      TEST_DATABASE_URL: postgresql://edu:edu@localhost:5432/edu_platform_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @edu/shared build

      - name: Prisma generate & push (test DB)
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: API unit tests
        run: pnpm --filter @edu/api test

      - name: API e2e tests
        run: pnpm --filter @edu/api test:e2e

      - name: Web build
        run: pnpm --filter @edu/web build
