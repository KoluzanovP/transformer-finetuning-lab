# Nginx: единый вход. Фронт и API — на одном домене.
# Копируется в /etc/nginx/conf.d/default.conf.
upstream edu_web { server web:3000; }
upstream edu_api { server api:4000; }

server {
  listen 80;
  server_name _;

  # Ограничение размера загружаемых файлов (медиа уроков).
  client_max_body_size 210m;

  # API и загруженные медиа — в бэкенд.
  location /api/ {
    proxy_pass http://edu_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {
    proxy_pass http://edu_api;
    proxy_set_header Host $host;
  }

  # Всё остальное — фронтенд Next.js.
  location / {
    proxy_pass http://edu_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
