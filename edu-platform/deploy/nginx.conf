# Nginx: единый вход. Фронт и API — на одном домене.
# Копируется в /etc/nginx/conf.d/default.conf (внутри http-контекста).

# Подробный лог: статус, путь, куда проксировали и с каким кодом ответил апстрим.
log_format edu '$remote_addr $status "$request" -> $upstream_addr ($upstream_status) '
               'len=$body_bytes_sent rt=$request_time';
access_log /dev/stdout edu;
error_log /dev/stderr warn;

upstream edu_web { server web:3000; }
upstream edu_api { server api:4000; }

server {
  # App Platform по умолчанию проксирует внешние 80/443 на порт 8080 контейнера.
  listen 8080;
  server_name _;

  # Ограничение размера загружаемых файлов (медиа уроков).
  client_max_body_size 210m;

  # Быстрая проверка, что наружу отвечает именно этот nginx.
  location = /_ping {
    add_header Content-Type text/plain;
    return 200 "edu-nginx ok\n";
  }

  # API и загруженные медиа — в бэкенд.
  location /api/ {
    proxy_pass http://edu_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {
    proxy_pass http://edu_api;
    proxy_set_header Host $host;
  }

  # Всё остальное — фронтенд Next.js (включая /_next/*).
  location / {
    proxy_pass http://edu_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
